
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrutados - Rastreo de autobuses</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Enrutados</h1>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="rutas.html">Rutas</a>
            <a href="mapa.html">Rastreo</a>
            <a href="foro.html">Foros</a>
        </nav>
    </header>

    <main>

        <section class="presentacion">
            <h2>Rastreo de autobuses</h2>
            <p>
                Consulta la ubicación de los autobuses y conoce
                información sobre sus recorridos.
            </p>
        </section>

        <section class="rastreo">

            <h2>Mapa de ubicación</h2>

            <p>Selecciona un autobús para consultar su información.</p>

            <div class="mapa">

    <button class="autobus bus1"
        data-numero="BUS-101"
        data-ruta="San José - Heredia"
        data-hora="10:35 a. m."
        data-id_ruta="103"> <!-- 👈 Mapea con San José - Heredia por Tibás -->
        🚌
    </button>

    <button class="autobus bus2"
        data-numero="BUS-205"
        data-ruta="San José - Alajuela"
        data-hora="10:40 a. m."
        data-id_ruta="101"> <!-- 👈 Mapea con San José - Alajuela por Pista -->
        🚌
    </button>

    <!-- Mapeado para usar los datos del Módulo B (Heredia - Cartago Directo) -->
<button class="autobus bus3"
    data-numero="BUS-310"
    data-ruta="Heredia - Cartago"
    data-hora="10:45 a. m."
    data-id_ruta="102">
    🚌
</button>


</div>


        </section>

    </main>

    <footer>
        <p>Enrutados - Transporte público en Costa Rica</p>
    </footer>

    <script src="js/mapa.js"></script>

</body>
</html>
